    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <g font-family="JetBrains Mono, monospace" text-anchor="middle">
    <g transform="translate(120 70)"><rect x="-66" y="-18" width="132" height="44" rx="10" fill="#0B1220" stroke="#1D4ED8"/><text y="8" fill="#E6EDF3" font-size="15" font-weight="700">SAST</text></g>
