<svg width="100%" height="28" viewBox="0 0 1000 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.22" stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="0.50" stop-color="#60A5FA"/>
      <stop offset="0.78" stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="80" y="13" width="840" height="2" rx="1" fill="url(#line)" opacity="0.85"/>
  <circle cy="14" r="4" fill="#93C5FD" filter="url(#glow)">
    <animate attributeName="cx" values="110;890;110" dur="5.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5.8s" repeatCount="indefinite"/>
  </circle>
</svg>
